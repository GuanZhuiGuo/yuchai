# A dedicated HTTPS tunnel forwards only to this loopback gateway.
server {
    listen 127.0.0.1:5320;
    server_name _;
    absolute_redirect off;

    include /etc/nginx/snippets/yuchai-training.conf;

    location = / { return 302 /yuchai-training/; }

    # Previously shared login links now return directly to the training centre.
    location = /login { return 302 /yuchai-training/; }

    location / { return 404; }
}
